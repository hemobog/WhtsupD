<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For D 💝</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Exact colors from your heart tunnel video */
            --bg-color: #2e003e;
            --heart-1: #3a0ca3;
            --heart-2: #f72585;
            --heart-3: #ff7b00;
            --heart-4: #ffcc00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            overflow: hidden; /* No scrolling allowed */
            width: 100vw;
            height: 100dvh; /* Dynamic height for mobile browsers */
            display: flex;
            justify-content: center;
            align-items: center;
            /* Hide default cursor on desktop for immersion */
            cursor: none;
            -webkit-tap-highlight-color: transparent; /* Removes blue tap box on Android */
        }

        /* --- BACKGROUND TUNNEL --- */
        .tunnel-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 1; pointer-events: none;
            will-change: transform;
        }
        .tunnel-heart {
            position: absolute; width: 100px; height: 100px;
            background-color: var(--color);
            transform: rotate(-45deg) scale(0);
            animation: tunnelAnimation 4s linear infinite;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        .tunnel-heart::before, .tunnel-heart::after {
            content: ""; position: absolute; width: 100px; height: 100px;
            background-color: inherit; border-radius: 50%;
        }
        .tunnel-heart::before { top: -50px; left: 0; }
        .tunnel-heart::after { top: 0; left: 50px; }

        @keyframes tunnelAnimation {
            0% { transform: rotate(-45deg) scale(0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: rotate(-45deg) scale(20); opacity: 0; z-index: 10; }
        }

        .tunnel-heart:nth-child(1) { --color: var(--heart-1); animation-delay: 0s; }
        .tunnel-heart:nth-child(2) { --color: var(--heart-2); animation-delay: 0.8s; }
        .tunnel-heart:nth-child(3) { --color: var(--heart-3); animation-delay: 1.6s; }
        .tunnel-heart:nth-child(4) { --color: var(--heart-4); animation-delay: 2.4s; }
        .tunnel-heart:nth-child(5) { --color: var(--heart-1); animation-delay: 3.2s; }

        /* --- 3D CARD CONTAINER --- */
        .scene {
            position: relative; z-index: 100; perspective: 1000px;
            display: flex; justify-content: center; align-items: center;
            width: 100%; height: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 20px; border-radius: 30px;
            text-align: center; color: white;
            width: 90%; max-width: 450px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transform-style: preserve-3d; transition: transform 0.1s ease-out;
        }

        h1 { 
            font-size: 3rem; margin-bottom: 25px; 
            text-shadow: 0 5px 15px rgba(0,0,0,0.3); 
        }
        
        .question-text {
            font-size: 1.6rem; font-weight: 700; margin-bottom: 30px; min-height: 2.5em;
            line-height: 1.3;
        }

        /* --- BUTTONS --- */
        .btn-container {
            position: relative; height: 160px; display: flex;
            justify-content: center; align-items: center; gap: 15px;
        }
        .btn {
            padding: 15px 35px; font-size: 1.1rem; font-weight: bold;
            border: none; border-radius: 50px; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            touch-action: manipulation; /* Improves touch response */
        }
        .yes-btn { background-color: #ffffff; color: var(--bg-color); z-index: 10; }
        .yes-btn:active { transform: scale(0.95); }
        
        .no-btn {
            background-color: white; color: var(--bg-color);
            position: absolute; right: 10px;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            will-change: transform;
        }

        /* WhatsApp Button */
        .wa-btn {
            margin-top: 20px; background-color: #25D366; color: white;
            display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
        }
        .wa-btn:hover { background-color: #128C7E; }

        .caption {
            position: absolute; top: -45px; width: 100%;
            color: var(--heart-4); font-weight: bold; font-size: 1.1rem;
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .caption.visible { opacity: 1; }

        /* --- DESKTOP CURSOR --- */
        .cursor-dot {
            position: fixed; width: 15px; height: 15px;
            background-color: white; border-radius: 50%;
            z-index: 9999; pointer-events: none;
            box-shadow: 0 0 15px white, 0 0 30px var(--heart-2);
            transform: translate(-50%, -50%);
        }
        .cursor-trail {
            position: fixed; pointer-events: none; z-index: 9998;
            font-size: 20px; animation: fadeFloat 1s forwards;
        }
        @keyframes fadeFloat {
            0% { opacity: 1; transform: scale(1) translate(0,0); }
            100% { opacity: 0; transform: scale(0.5) translate(0, -30px); }
        }

        .hidden { display: none; }
        .final-msg { font-size: 1.8rem; line-height: 1.4; animation: popIn 0.8s; margin-bottom: 20px;}
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* --- MOBILE TWEAKS --- */
        @media (max-width: 768px) {
            body { cursor: auto; } /* Use normal cursor on phone */
            .cursor-dot, .cursor-trail { display: none; } /* Hide glowing cursor on phone */
            .card { width: 95%; padding: 40px 20px; }
            h1 { font-size: 2.5rem; }
            .btn { padding: 14px 32px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/03/09/audio_822ca8b474.mp3?filename=piano-moment-111662.mp3" type="audio/mpeg">
    </audio>

    <div class="cursor-dot" id="cursorDot"></div>

    <div class="tunnel-container">
        <div class="tunnel-heart"></div><div class="tunnel-heart"></div>
        <div class="tunnel-heart"></div><div class="tunnel-heart"></div><div class="tunnel-heart"></div>
    </div>

    <div class="scene">
        <div class="card" id="tiltCard">
            
            <div id="step1">
                <h1>Hey D ✨</h1>
                <button class="btn yes-btn" onclick="goToStep2()">Step Inside 💝</button>
            </div>

            <div id="step2" class="hidden">
                <div class="question-text" id="questionText"></div>
                <div class="btn-container">
                    <div id="caption" class="caption">Nice try! 😏</div>
                    <button class="btn yes-btn" onclick="handleYes()">Yes! 💕</button>
                    <button class="btn no-btn" id="noBtn" onmouseover="moveNoButton()" ontouchstart="moveNoButton(event)">No</button>
                </div>
            </div>

            <div id="step3" class="hidden">
                <div class="final-msg">Well... that went exactly as expected 😄💗</div>
                <button class="btn wa-btn" onclick="sendWhatsApp()">
                    Send Confirmation 💌
                </button>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        // I have pre-filled your number here:
        const phoneNumber = "917014125541"; 
        const waMessage = "Okay fine, I'll be your Valentine! 💖👀"; 
        // ==========================================

        const cursorDot = document.getElementById('cursorDot');
        const card = document.getElementById('tiltCard');
        const music = document.getElementById('bgMusic');
        music.volume = 0.6;

        // --- MOUSE EFFECTS ---
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX, y = e.clientY;
            cursorDot.style.left = `${x}px`;
            cursorDot.style.top = `${y}px`;
            
            // 3D Tilt
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const rx = ((cy - y) / cy) * 5;
            const ry = ((x - cx) / cx) * 5;
            card.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg)`;

            if(Math.random() < 0.1) createTrail(x, y);
        });

        function createTrail(x, y) {
            const el = document.createElement('div');
            el.className = 'cursor-trail'; el.innerHTML = '❤️';
            el.style.left = `${x}px`; el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        // --- GAME LOGIC ---
        const questions = [
            "Do you think I'm cute? 😊",
            "Text me every morning? ☀️",
            "Go on a date with me? 🎭",
            "Will you be my Valentine? 💖"
        ];
        
        const flirtyLines = ["Too slow! 🏃‍♂️", "Nice try! 😏", "Missed me! 😜", "Can't touch this! ⚡", "Nope! 😂"];
        let qIndex = 0, lineIndex = 0;

        function typeWriter(text, elementId, speed = 40) {
            const el = document.getElementById(elementId);
            el.innerHTML = "";
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        function goToStep2() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            
            music.play().catch(e => console.log("Music interaction check"));
            typeWriter(questions[0], 'questionText');
        }

        function moveNoButton(event) {
            if(event) event.preventDefault(); // Stop mobile zoom/selection
            
            // Safe boundaries for mobile
            const limit = window.innerWidth < 768 ? 70 : 120; 
            
            const x = (Math.random() * limit * 2) - limit;
            const y = (Math.random() * limit * 2) - limit;
            
            document.getElementById('noBtn').style.transform = `translate(${x}px, ${y}px)`;
            
            const cap = document.getElementById('caption');
            cap.innerText = flirtyLines[lineIndex];
            cap.classList.add('visible');
            lineIndex = (lineIndex + 1) % flirtyLines.length;
        }

        function handleYes() {
            qIndex++;
            if (qIndex < questions.length) {
                typeWriter(questions[qIndex], 'questionText');
                document.getElementById('noBtn').style.transform = 'translate(0, 0)';
                document.getElementById('caption').classList.remove('visible');
            } else {
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
                triggerConfetti();
            }
        }

        function sendWhatsApp() {
            const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(waMessage)}`;
            window.open(url, '_blank');
        }

        function triggerConfetti() {
            for(let i=0; i<50; i++) {
                setTimeout(() => {
                    createTrail(
                        window.innerWidth/2 + (Math.random()*300 - 150), 
                        window.innerHeight/2 + (Math.random()*300 - 150)
                    );
                }, i * 30);
            }
        }
    </script>
</body>
</html>
